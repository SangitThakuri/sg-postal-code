name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── CI: always runs ──────────────────────────────────────────────────────────
  ci:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # cloudflare-env.d.ts is gitignored (regenerated from wrangler.jsonc,
      # doesn't need real Cloudflare auth) — without it, `env.DB` has no
      # type and tsc/next build fail with "Property 'DB' does not exist".
      - name: Generate Cloudflare types
        run: npm run cf:typegen

      - name: Type check
        run: npx tsc --noEmit

  # ── Deploy: only runs when Cloudflare secrets are configured ────────────────
  deploy:
    name: Build & Deploy Worker
    runs-on: ubuntu-latest
    needs: ci
    if: secrets.CLOUDFLARE_API_TOKEN != ''
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cf:typegen

      # buildings.json is committed to the repo and no longer read by the app
      # at runtime (D1 is the data source) — this just satisfies the build
      # script; .assetsignore keeps it out of the deployed Worker's assets.
      - name: Build for Cloudflare
        run: npm run cf:build

      - name: Deploy Worker
        run: npx wrangler deploy
